[project]
name = "mission-control"
version = "0.1.0"
description = "Mission Control: multi-tenant crew planning and matching API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "pwdlib[argon2]>=0.2",
    "scipy>=1.13",
]

[project.scripts]
mission-control-seed = "mission_control.seed:main"

[dependency-groups]
dev = [
    "mission-control-cli",
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = true

[tool.uv.workspace]
members = ["cli"]

[tool.uv.sources]
mission-control-cli = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mission_control"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "cli/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI/Typer use calls in argument defaults by design

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["db: requires the Postgres test database"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`", "ignore::getpass.GetPassWarning"]
